; RF-Tracker: dual-band CC1101 logger for ESP32.
; Pinned to the toolchain verified in this repository's Cloud Agent image.
; Override the board with `pio run -e esp32dev` or copy the env for a new module.

[platformio]
default_envs = esp32dev
description = Receive-only 433/868 MHz logger with GPS, OLED, SD and a web UI

[env:esp32dev]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps =
  jgromes/RadioLib@7.8.0
  mikalhart/TinyGPSPlus@1.1.0
  bblanchon/ArduinoJson@7.4.2
  olikraus/U8g2@2.36.18
  ESP32Async/AsyncTCP@3.5.0
  ESP32Async/ESPAsyncWebServer@3.12.1
build_flags =
  -D RF_TRACKER_VERSION=\"0.1.0\"
  -Wall
  -Wextra
  -Wno-unused-parameter
